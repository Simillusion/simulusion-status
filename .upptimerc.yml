# Uptime checks for status.simulusion.co (Upptime). The page itself is built
# by status-site/build.mjs (workflow "Status page"); slugs match
# status-site/parts.json.
owner: Simillusion
repo: simulusion-status

sites:
  - name: Website
    slug: website
    url: https://simulusion.co
  - name: Sign-in
    slug: sign-in
    url: https://platform.simulusion.co/v0/health/signin
  - name: Web app
    slug: web-app
    url: https://platform.simulusion.co/
  - name: API
    slug: api
    url: https://platform.simulusion.co/v0/health/api
  - name: Hosted sessions
    slug: hosted-sessions
    url: https://platform.simulusion.co/v0/health/sessions
  - name: Recordings and replays
    slug: recordings
    url: https://platform.simulusion.co/v0/health/recordings
  - name: GPU machines
    slug: gpu-machines
    url: https://platform.simulusion.co/v0/health/machines
  - name: Project Earth
    slug: project-earth
    url: https://platform.simulusion.co/v0/health/earth

status-website:
  # DNS at GoDaddy: CNAME status -> simillusion.github.io
  cname: status.simulusion.co
  name: Simulusion status
  introTitle: "Simulusion status"
  introMessage: Live status of the Simulusion website and platform.
