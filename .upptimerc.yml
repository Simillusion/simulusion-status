# Uptime checks and status page for Simulusion (Upptime).
owner: Simillusion
repo: simulusion-status

sites:
  - name: Website
    url: https://simulusion.co
  - name: Platform
    url: https://platform.simulusion.co/
  - name: Platform API
    url: https://platform.simulusion.co/v0/me
    # Without a token the API answers 401: that means it is up.
    expectedStatusCodes:
      - 401

status-website:
  # At launch: add DNS "CNAME status -> simillusion.github.io", then
  # uncomment cname, delete baseUrl, and turn on Enforce HTTPS in Pages.
  # cname: status.simulusion.co
  baseUrl: /simulusion-status
  name: Simulusion status
  introTitle: "Simulusion status"
  introMessage: Live status of the Simulusion website and platform.
  navbar:
    - title: Status
      href: /
    - title: Simulusion
      href: https://simulusion.co
